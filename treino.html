<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Treino de Musculação para Luana" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>Treino de Musculação para Luana</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #22c55e;
      --danger: #ef4444;
      --border: #334155;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-right: max(16px, env(safe-area-inset-right));
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      padding-left: max(16px, env(safe-area-inset-left));
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }

    h1, h2 {
      margin: 0 0 12px;
      line-height: 1.2;
    }

    h1 { font-size: 1.5rem; }
    h2 { font-size: 1.1rem; color: var(--muted); }

    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .exercise-name {
      font-weight: 600;
      font-size: 1rem;
    }

    .exercise-weight {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    input[type="number"],
    input[type="text"] {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      background: #0b1220;
      color: var(--text);
      font-size: 1rem;
      min-height: 44px;
      -webkit-appearance: none;
      appearance: none;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      min-height: 44px;
      touch-action: manipulation;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .btn-primary { background: var(--accent); color: #052e16; }
    .btn-secondary { background: #334155; color: var(--text); }
    .btn-danger { background: var(--danger); color: #fff; }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .muted { color: var(--muted); font-size: 0.9rem; }

    .timer-display {
      font-size: 2rem;
      font-weight: 700;
      text-align: center;
      margin: 8px 0 12px;
      letter-spacing: 1px;
    }

    .timer-inputs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .add-form {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .pill {
      background: #0b1220;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.8rem;
      padding: 4px 8px;
      border-radius: 999px;
      display: inline-block;
      margin-bottom: 8px;
    }

    .day-selector {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .day-btn {
      background: #334155;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .day-btn.active {
      background: var(--accent);
      color: #052e16;
      border-color: var(--accent);
    }

    .block {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 10px;
      background: #0b1220;
    }

    .block-title {
      font-size: 0.98rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .block-meta {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .exercise-meta {
      color: var(--muted);
      font-size: 0.86rem;
      line-height: 1.3;
    }

    .section-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 400px) {
      .row {
        grid-template-columns: 1fr;
      }
      .exercise-weight {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Treino de Musculação para Luana</h1>
      <span class="pill">Salvo no celular automaticamente</span>
      <h2>ABCD - 45 minutos</h2>

      <div class="day-selector" id="daySelector" aria-label="Seleção de treino por dia">
        <button class="day-btn" data-day="A" aria-label="Treino A">A</button>
        <button class="day-btn" data-day="B" aria-label="Treino B">B</button>
        <button class="day-btn" data-day="C" aria-label="Treino C">C</button>
        <button class="day-btn" data-day="D" aria-label="Treino D">D</button>
      </div>

      <p id="dayTitle" class="exercise-name"></p>
      <p id="dayFocus" class="muted"></p>
      <div id="exerciseList"></div>

      <div class="section-actions">
        <button id="resetDayBtn" class="btn-secondary">Resetar cargas do treino</button>
        <button id="resetAllBtn" class="btn-danger">Resetar todas as cargas</button>
      </div>
      <p class="muted">Edite os pesos em cada exercício. Salvamento automático.</p>
    </div>

    <div class="card">
      <h2>Timer de descanso</h2>
      <div id="timerDisplay" class="timer-display" role="timer" aria-live="polite" aria-atomic="true">01:30</div>

      <div class="timer-inputs">
        <label for="minutesInput" class="sr-only">Minutos</label>
        <input id="minutesInput" type="text" inputmode="numeric" value="1" title="Minutos" aria-label="Minutos" placeholder="Min" />
        <label for="secondsInput" class="sr-only">Segundos</label>
        <input id="secondsInput" type="text" inputmode="numeric" value="30" title="Segundos" aria-label="Segundos" placeholder="Seg" />
      </div>

      <div class="actions">
        <button id="setTimerBtn" class="btn-secondary">Definir tempo</button>
        <button id="startPauseBtn" class="btn-primary">Iniciar</button>
        <button id="resetTimerBtn" class="btn-danger">Resetar</button>
      </div>
      <p class="muted">Formato: minutos e segundos.</p>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'meuTreinoCargasV2';
    const ACTIVE_DAY_KEY = 'meuTreinoDiaAtivoV1';

    const PLANOS = {
      A: {
        titulo: 'Treino A: Superiores (Costas e Bíceps)',
        foco: '',
        blocos: [
          {
            titulo: 'Série principal',
            meta: '',
            exercicios: [
              { id: 'a_puxada_alta', nome: 'Puxada Alta (Pulley)', reps: '3 x 12 a 15 rep.', nota: '' },
              { id: 'a_remada_baixa', nome: 'Remada Baixa (Triângulo)', reps: '3 x 12 a 15 rep.', nota: '' },
              { id: 'a_elevacao_lateral', nome: 'Elevação Lateral (Ombros)', reps: '3 x 15 rep.', nota: '' },
              { id: 'a_desenvolvimento_ombros', nome: 'Desenvolvimento (Halteres)', reps: '3 x 12 rep.', nota: '' },
              { id: 'a_rosca_direta', nome: 'Rosca Direta (Polia ou Halter)', reps: '3 x 15 rep.', nota: '' },
              { id: 'a_abdominal_infra', nome: 'Abdominal Infra (Elevação de pernas)', reps: '3 x 20 rep.', nota: '' }
            ]
          }
        ]
      },
      B: {
        titulo: 'Treino B: Inferiores (Quadríceps)',
        foco: '',
        blocos: [
          {
            titulo: 'Série principal',
            meta: '',
            exercicios: [
              { id: 'b_agachamento', nome: 'Agachamento Livre ou Smith', reps: '4 x 10 a 12 rep.', nota: '' },
              { id: 'b_legpress', nome: 'Leg Press 45°', reps: '3 x 12 a 15 rep.', nota: '' },
              { id: 'b_extensora', nome: 'Cadeira Extensora', reps: '3 x 12 rep.', nota: '(+10s de isometria no final da última série).' },
              { id: 'b_afundo_estatico', nome: 'Afundo (Passada Estática)', reps: '3 x 12 rep.', nota: '(cada perna).' },
              { id: 'b_panturrilha_sentada', nome: 'Panturrilha Sentada', reps: '4 x 15 a 20 rep.', nota: '' }
            ]
          }
        ]
      },
      C: {
        titulo: 'Treino C: Superiores (Peito e Tríceps)',
        foco: '',
        blocos: [
          {
            titulo: 'Série principal',
            meta: '',
            exercicios: [
              { id: 'c_supino_reto_halteres', nome: 'Supino Reto (Halteres)', reps: '3 x 12 rep.', nota: '' },
              { id: 'c_crucifixo_inclinado', nome: 'Crucifixo Inclinado', reps: '3 x 15 rep.', nota: '' },
              { id: 'c_triceps_corda', nome: 'Tríceps Corda (Polia)', reps: '3 x 15 rep.', nota: '' },
              { id: 'c_triceps_frances', nome: 'Tríceps Francês (Halter)', reps: '3 x 12 rep.', nota: '' },
              { id: 'c_abdominal_supra', nome: 'Abdominal Supra (Remador)', reps: '3 x 20 rep.', nota: '' },
              { id: 'c_prancha', nome: 'Prancha Abdominal', reps: '3 x 45 a 60 segundos.', nota: '' }
            ]
          }
        ]
      },
      D: {
        titulo: 'Treino D: Inferiores (Glúteo e Posterior)',
        foco: '',
        blocos: [
          {
            titulo: 'Série principal',
            meta: '',
            exercicios: [
              { id: 'd_elevacao_pelvica', nome: 'Elevação Pélvica', reps: '4 x 10 a 12 rep.', nota: '' },
              { id: 'd_stiff', nome: 'Stiff (Barra ou Halteres)', reps: '3 x 12 rep.', nota: '' },
              { id: 'd_cadeira_flexora', nome: 'Cadeira Flexora', reps: '3 x 12 a 15 rep.', nota: '' },
              { id: 'd_cadeira_abdutora', nome: 'Cadeira Abdutora', reps: '3 x 20 rep.', nota: '(tronco inclinado à frente).' },
              { id: 'd_gluteo_cabo', nome: 'Glúteo no Cabo (Polia)', reps: '3 x 12 rep.', nota: '(cada perna).' }
            ]
          }
        ]
      }
    };

    const listEl = document.getElementById('exerciseList');
    const daySelectorEl = document.getElementById('daySelector');
    const dayTitleEl = document.getElementById('dayTitle');
    const dayFocusEl = document.getElementById('dayFocus');
    const resetDayBtn = document.getElementById('resetDayBtn');
    const resetAllBtn = document.getElementById('resetAllBtn');

    const timerDisplayEl = document.getElementById('timerDisplay');
    const minutesInputEl = document.getElementById('minutesInput');
    const secondsInputEl = document.getElementById('secondsInput');
    const setTimerBtn = document.getElementById('setTimerBtn');
    const startPauseBtn = document.getElementById('startPauseBtn');
    const resetTimerBtn = document.getElementById('resetTimerBtn');

    let cargas = loadCargas();
    let activeDay = loadActiveDay();
    let totalSeconds = 90;
    let remainingSeconds = totalSeconds;
    let timerId = null;

    function loadCargas() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return {};
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== 'object') return {};
        return parsed;
      } catch {
        return {};
      }
    }

    function saveCargas() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cargas));
    }

    function loadActiveDay() {
      const saved = localStorage.getItem(ACTIVE_DAY_KEY);
      if (saved && PLANOS[saved]) return saved;
      return 'A';
    }

    function saveActiveDay() {
      localStorage.setItem(ACTIVE_DAY_KEY, activeDay);
    }

    function renderExercises() {
      listEl.innerHTML = '';
      const plano = PLANOS[activeDay];

      dayTitleEl.textContent = plano.titulo;
      dayFocusEl.textContent = plano.foco;

      daySelectorEl.querySelectorAll('button').forEach((btn) => {
        const isActive = btn.dataset.day === activeDay;
        btn.classList.toggle('active', isActive);
        btn.setAttribute('aria-pressed', String(isActive));
      });

      plano.blocos.forEach((bloco) => {
        const blocoEl = document.createElement('div');
        blocoEl.className = 'block';

        const tituloEl = document.createElement('div');
        tituloEl.className = 'block-title';
        tituloEl.textContent = bloco.titulo;

        const metaEl = document.createElement('div');
        metaEl.className = 'block-meta';
        metaEl.textContent = bloco.meta;

        blocoEl.appendChild(tituloEl);
        blocoEl.appendChild(metaEl);

        bloco.exercicios.forEach((exercise) => {
          const row = document.createElement('div');
          row.className = 'row';

          const left = document.createElement('div');
          const name = document.createElement('div');
          name.className = 'exercise-name';
          name.textContent = exercise.nome;

          const meta = document.createElement('div');
          meta.className = 'exercise-meta';
          meta.textContent = `${exercise.reps}${exercise.nota ? ` • ${exercise.nota}` : ''}`;

          left.append(name, meta);

          const right = document.createElement('div');
          right.className = 'exercise-weight';

          const weightInput = document.createElement('input');
          weightInput.type = 'number';
          weightInput.min = '0';
          weightInput.step = '0.5';
          weightInput.inputMode = 'decimal';
          weightInput.setAttribute('aria-label', `Carga em kg para ${exercise.nome}`);
          weightInput.style.width = '90px';
          weightInput.value = typeof cargas[exercise.id] === 'number' ? cargas[exercise.id] : 0;
          weightInput.addEventListener('input', () => {
            const value = Number(weightInput.value);
            cargas[exercise.id] = Number.isNaN(value) ? 0 : value;
            saveCargas();
          });

          const kg = document.createElement('span');
          kg.textContent = 'kg';
          kg.className = 'muted';

          right.append(weightInput, kg);
          row.append(left, right);
          blocoEl.appendChild(row);
        });

        listEl.appendChild(blocoEl);
      });
    }

    function resetCurrentDayLoads() {
      const plano = PLANOS[activeDay];
      plano.blocos.forEach((bloco) => {
        bloco.exercicios.forEach((exercise) => {
          cargas[exercise.id] = 0;
        });
      });
      saveCargas();
      renderExercises();
    }

    function resetAllLoads() {
      cargas = {};
      saveCargas();
      renderExercises();
    }

    daySelectorEl.addEventListener('click', (event) => {
      const button = event.target.closest('button[data-day]');
      if (!button) return;
      activeDay = button.dataset.day;
      saveActiveDay();
      renderExercises();
    });

    resetDayBtn.addEventListener('click', () => {
      if (confirm('Resetar todas as cargas apenas do treino atual?')) {
        resetCurrentDayLoads();
      }
    });

    resetAllBtn.addEventListener('click', () => {
      if (confirm('Resetar todas as cargas de todos os treinos?')) {
        resetAllLoads();
      }
    });

    function formatTime(seconds) {
      const min = Math.floor(seconds / 60).toString().padStart(2, '0');
      const sec = (seconds % 60).toString().padStart(2, '0');
      return `${min}:${sec}`;
    }

    function updateTimerDisplay() {
      timerDisplayEl.textContent = formatTime(remainingSeconds);
    }

    function stopTimer() {
      if (timerId) {
        clearInterval(timerId);
        timerId = null;
      }
      startPauseBtn.textContent = 'Iniciar';
    }

    function startTimer() {
      if (remainingSeconds <= 0) return;
      timerId = setInterval(() => {
        remainingSeconds -= 1;
        updateTimerDisplay();

        if (remainingSeconds <= 0) {
          stopTimer();
          if ('vibrate' in navigator) {
            navigator.vibrate([250, 150, 250]);
          }
          alert('Tempo finalizado!');
        }
      }, 1000);
      startPauseBtn.textContent = 'Pausar';
    }

    setTimerBtn.addEventListener('click', () => {
      const minuteStr = (minutesInputEl.value || '0').trim();
      const secondStr = (secondsInputEl.value || '0').trim();
      
      const parsedMinutes = parseInt(minuteStr, 10);
      const parsedSeconds = parseInt(secondStr, 10);

      const minutes = !isNaN(parsedMinutes)
        ? Math.max(0, Math.min(59, parsedMinutes))
        : 0;
      const seconds = !isNaN(parsedSeconds)
        ? Math.max(0, Math.min(59, parsedSeconds))
        : 0;

      totalSeconds = minutes * 60 + seconds;
      if (totalSeconds === 0) totalSeconds = 60;
      remainingSeconds = totalSeconds;
      stopTimer();
      updateTimerDisplay();
    })

    startPauseBtn.addEventListener('click', () => {
      if (timerId) {
        stopTimer();
      } else {
        startTimer();
      }
    });

    resetTimerBtn.addEventListener('click', () => {
      remainingSeconds = totalSeconds;
      stopTimer();
      updateTimerDisplay();
    });

    renderExercises();
    updateTimerDisplay();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
</body>
</html>
